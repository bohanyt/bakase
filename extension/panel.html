<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakase</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #0d0d0d;
      --muted: #5d5d5d;
      font: 450 15px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #212121; --fg: #ececec; --muted: #b4b4b4; }
    }
    html, body { margin: 0; height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; }
    iframe:not([hidden]) { display: block; }
    #offline { max-width: 25rem; margin: 0 auto; padding: 3rem 1.25rem; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.2rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.5; }
    button {
      border: 0;
      border-radius: 999px;
      padding: .5rem 1rem;
      font: inherit;
      font-weight: 600;
      color: var(--bg);
      background: var(--fg);
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  </style>
</head>
<body>
  <iframe id="app" title="Bakase" allow="clipboard-write" hidden></iframe>
  <main id="offline" hidden>
    <div role="status">
      <h1>Bakase belum bisa dibuka</h1>
      <p>Sambungkan ke jaringan kantor atau VPN, lalu coba lagi.</p>
    </div>
    <button id="retry" type="button">Coba lagi</button>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
